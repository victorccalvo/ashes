name: Publish Ashes

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Test game
        run: |
          node smoke-test.cjs
          node balance-test.cjs
          node hunter-test.cjs
          node status-test.cjs
          node act-balance-test.cjs
          node campaign-test.cjs
          node campaign-balance.cjs
          node campaign-progression.cjs
          node endless-test.cjs
          node equipment-test.cjs
          node attribute-test.cjs
          node adventure-test.cjs
          node feedback-test.cjs
          node magic-balance-test.cjs
          node enemy-defense-test.cjs
          node party-test.cjs
          node party-rest-test.cjs
          node run-systems-test.cjs
          node balance-update-test.cjs
          node balance-reference-test.cjs
          node party-balance-test.cjs
          node secret-test.cjs
          node secret-balance-test.cjs
      - name: Prepare static site
        run: node scripts/build-site.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
